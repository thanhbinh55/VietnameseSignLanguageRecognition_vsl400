data:
  dataset: visl_400
  modality: pose
  subset: cam_1
  data_dir: data/processed/vsl_400
  transform:
    aug_prob: 0.3
    add_gaussian_noise: true
    gaussian_noise_mean: 0.0
    gaussian_noise_std: 0.001
    interpolate: true   # PoseInterpolate — linear interp for missing keypoints (Roh et al. 2024, Run 07-08)
    anchor: "neck"      # Neck anchor normalization — best result in ablation +3% Test Acc (Run 08)
    include_face: false # Facial landmarks did not improve in this dataset/setup (Run 15)
  fps: 25
  debug: False
model:
  arch: spoter
  num_frozen_layers: 0
  num_frames: 96
  hidden_dim: 108
training:
  output_dir: experiments/spoter_vsl400
  run_name: spoter_vsl400
  learning_rate: 0.0005
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  num_train_epochs: 100
  per_device_train_batch_size: 64
  per_device_eval_batch_size: 128
  gradient_accumulation_steps: 1
  dataloader_num_workers: 2
  dataloader_pin_memory: false
  dataloader_persistent_workers: true
  save_total_limit: 3
  save_safetensors: true
  fp16: false
  bf16: false
  use_cpu: false
  use_mps_device: true
  metric_for_best_model: accuracy
  report_to: null
