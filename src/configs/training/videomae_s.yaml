data:
  dataset: visl_400
  modality: rgb
  subset: cam_1
  data_dir: data/processed/vsl_400
  transform:
    horizontal_flip_prob: 0.5
    aug_type: augmix
    aug_paras:
      magnitude: 3
      alpha: 1.0
      width: 5
      depth: -1
    sample_rate: 4
  fps: 30
  debug: False
model:
  arch: videomae
  # Point to a local videomae checkpoint after training, e.g.:
  # pretrained: experiments/videomae_s_v2.0
  # For first-time training from ImageNet/Kinetics weights, leave pretrained as null
  # and the model will be initialised from scratch.
  pretrained: null
training:
  run_name: videomae_s_v2.0
  output_dir: experiments/videomae_s_v2.0
  learning_rate: 0.00005
  weight_decay: 0
  num_train_epochs: 30
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  metric_for_best_model: accuracy
  report_to: null