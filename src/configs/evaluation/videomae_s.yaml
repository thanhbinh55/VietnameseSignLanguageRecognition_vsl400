data:
  dataset: visl_400
  modality: rgb
  subset: cam_1
  data_dir: data/processed/vsl_400
  transform:
    horizontal_flip_prob: 0.5
    aug_type: augmix
    aug_paras:
      magnitude: 3
      alpha: 1.0
      width: 5
      depth: -1
    sample_rate: 4
  fps: 30
  debug: False
evaluation:
  arch: videomae
  pretrained: experiments/videomae_s_v2.0
  eval_set: test
  batch_size: 4